spring:
  application:
    name: workflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:workflow}

  jpa:
    hibernate:
      ddl-auto: validate   # o schema é gerido pelo Flyway, o Hibernate só valida
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
